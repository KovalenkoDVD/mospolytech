version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: lab_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: labdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d labdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lab-net

  web-service:
    build: ./web-service
    container_name: lab_web_service
    networks:
      - lab-net

  backend:
    build: ./backend
    container_name: lab_backend
    ports:
      - "3000:3000" # Expose for frontend JS fetch
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_NAME: labdb
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lab-net

  frontend:
    build: ./frontend
    container_name: lab_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - lab-net

volumes:
  pgdata:

networks:
  lab-net:
    driver: bridge
